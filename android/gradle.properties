org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Bug conocido de Kotlin incremental en Windows cuando el proyecto (D:) y la
# caché de paquetes pub (C:\...\Pub\Cache) están en discos distintos — el
# cálculo de ruta relativa del compilador falla ("this and base files have
# different roots"). Se desactiva incremental para evitar el crash; el build
# release igual compila entero cada vez, solo es más lento, no menos correcto.
kotlin.incremental=false
