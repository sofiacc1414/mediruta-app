# La app usa ruteo por hash (#/...) en web — el fragmento nunca llega
# al servidor, así que basta con servir index.html en la raíz. El
# try_files queda igual como respaldo si en el futuro se activa
# path-based routing (usePathUrlStrategy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
